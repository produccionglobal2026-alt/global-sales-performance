$('#logout').onclick=async()=>{if(realtime)await db.removeChannel(realtime);await db.auth.signOut()};
async function signedIn(u){user=u;let {data,error:e}=await db.from('delivery_profiles').select('full_name,role').eq('user_id',user.id).single();if(e||!data){$('#loginmsg').textContent='Usuario no autorizado. Solicita a Administración que configure tu perfil.';await db.auth.signOut();return}profile=data;$('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=data.full_name+' · '+(data.role==='admin'?'Administración': 'Conductor');$('#day').value=day;buildNav();await refresh();if(realtime)await db.removeChannel(realtime);realtime=db.channel('delivery-changes').on('postgres_changes',{event:'*',schema:'public',table:'delivery_orders'},()=>refresh()).subscribe();}
function buildNav(){const v=[['panel','Panel'],['pedidos','Planificación'],['calendario','Calendario'],['informes','Informes']];if(profile.role==='jason')v.splice(2,0,['rutas','Asignar rutas']);if(profile.role!=='admin')v.splice(1,0,['mis','Mis entregas']);$('#nav').innerHTML=v.map(([id,n])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${n}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;buildNav();render()})}
async function refresh(){if(!db||!profile)return;$('#notify').textContent='Sincronizando...';let {data,error:e}=await db.from('delivery_orders').select('*').order('dispatch_date',{ascending:false}).order('route_order',{ascending:true});if(e){$('#notify').textContent='Error de conexión';error(e);return}orders=data||[];$('#notify').textContent='Actualizado '+new Date().toLocaleTimeString('es-EC');render()}
const current=()=>orders.filter(o=>o.dispatch_date===day),internal=()=>current().filter(o=>o.category==='internal');
function render(){if(!profile)return;$('#day').value=day;const el=$('#content');if(tab==='panel')el.innerHTML=panel();if(tab==='pedidos')el.innerHTML=planning();if(tab==='mis')el.innerHTML=myDeliveries();if(tab==='rutas')el.innerHTML=routes();if(tab==='informes')el.innerHTML=reports();if(tab==='calendario')el.innerHTML=calendar();}
function panel(){let a=internal(),done=a.filter(o=>o.status==='Entregado').length;return `<div class="statgrid">${[['Entregas internas',a.length],['Asignadas',a.filter(o=>o.driver).length],['Entregadas',done],['En ruta',a.filter(o=>o.status==='En ruta').length],['Novedades',a.filter(o=>['Parcial','No entregado'].includes(o.status)).length],['Envíos externos',current().filter(o=>o.category==='external').length]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="panel2" style="margin-top:16px"><h3>Cumplimiento diario</h3><p>${a.length?Math.round(done*100/a.length):0}% · ${done} entregas de ${a.length}</p><progress value="${done}" max="${Math.max(a.length,1)}" style="width:100%;height:24px"></progress></div><div class="panel2"><h3>Resumen por conductor</h3>${['jason','jefferson'].map(k=>{let r=a.filter(o=>o.driver===k);return `<p><b>${dname(k)}</b>: ${r.filter(o=>o.status==='Entregado').length} entregadas de ${r.length} asignadas</p>`}).join('')}</div>`}
function tr(o,more=''){return `<tr><td><b>${esc(o.order_number)}</b><div class="muted">${esc(o.dispatch_date)}</div></td><td>${esc(o.client)}<div class="muted">${esc(o.destination)}</div></td><td>${esc(o.notes)}</td><td>${esc(dname(o.driver))}</td><td>${esc(o.status)}</td>${more}<td>${o.category==='internal'?`<button class="secondary" onclick="viewEvidence('${o.id}')">📷 Ver</button>`:'—'}</td></tr>`}
function planning(){return `<div class="panel2"><div class="flex"><h2 class="grow">Planificación AS2</h2>${profile.role==='admin'?'<button class="primary" onclick="openImport()">Importar PDF AS2</button>':''}</div><p class="muted">Envíos externos separados de entregas internas. La importación requiere revisión.</p><h3>Entregas internas (${internal().length})</h3><div class="tablewrap"><table class="deliverytable"><thead><tr><th>Pedido</th><th>Cliente / destino</th><th>Nota AS2</th><th>Conductor</th><th>Estado</th><th>Evidencia</th></tr></thead><tbody>${internal().map(o=>tr(o)).join('')}</tbody></table></div><h3>Envíos externos (${current().filter(o=>o.category==='external').length})</h3><div class="tablewrap"><table class="deliverytable"><tbody>${current().filter(o=>o.category==='external').map(o=>tr(o)).join('')}</tbody></table></div></div>`}
function routes(){if(profile.role!=='jason')return '';let a=internal().sort((x,y)=>(x.driver||'z').localeCompare(y.driver||'z')||(x.route_order||999)-(y.route_order||999));return `<div class="panel2"><h2>Asignación y orden de recorrido</h2><p>Jason asigna entregas y define paradas para cada conductor. Presiona Guardar en cada pedido.</p><div class="tablewrap"><table class="deliverytable"><thead><tr><th>Pedido</th><th>Cliente</th><th>Conductor</th><th>Parada</th><th>Acción</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.client)}<div class="muted">${esc(o.destination)}</div></td><td><select class="control" id="driver-${o.id}" ${['Entregado','Parcial'].includes(o.status)?'disabled':''}><option value="">Sin asignar</option>${['jason','jefferson'].map(k=>`<option value="${k}" ${o.driver===k?'selected':''}>${dname(k)}</option>`).join('')}</select></td><td><input class="control" id="stop-${o.id}" type="number" min="1" style="width:75px" value="${o.route_order||''}" ${['Entregado','Parcial'].includes(o.status)?'disabled':''}></td><td><button class="primary" onclick="assign('${o.id}')" ${['Entregado','Parcial'].includes(o.status)?'disabled':''}>Guardar</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function assign(id){const driver=$('#driver-'+id).value||null,raw=$('#stop-'+id).value,position=raw===''?null:Number(raw);if(position!==null&&(!Number.isInteger(position)||position<1))return alert('Posición inválida');let {error:e}=await db.rpc('assign_delivery',{p_id:id,p_driver:driver,p_position:position});if(e)return error(e);await refresh()}
function myDeliveries(){let a=internal().filter(o=>o.driver===profile.role).sort((x,y)=>(x.route_order||9999)-(y.route_order||9999));return `<div class="panel2"><h2>Mi ruta · ${esc(profile.full_name)}</h2><p>${a.length} entregas asignadas para ${esc(day)}</p>${a.length?a.map(o=>`<div class="panel2"><div class="flex"><strong>Parada ${o.route_order||'s/n'} · ${esc(o.order_number)}</strong><span class="tag2">${esc(o.status)}</span></div><h3>${esc(o.client)}</h3><p>${esc(o.destination)} ${o.notes?'<br>'+esc(o.notes):''}</p><button class="primary" onclick="editDelivery('${o.id}')" ${o.status==='Entregado'?'disabled':''}>Actualizar entrega</button> <button class="secondary" onclick="viewEvidence('${o.id}')">📷 Ver evidencia</button></div>`).join(''):'<p>No tienes entregas asignadas para esta fecha.</p>'}</div>`}
function editDelivery(id){let o=orders.find(x=>x.id===id);if(!o||o.driver!==profile.role)return;$('#modal').innerHTML=`<div class="modalbg"><div class="modalbox"><div class="flex"><h3 class="grow">${esc(o.order_number)} · ${esc(o.client)}</h3><button class="secondary" onclick="closeModal()">Cerrar</button></div><div class="field-row"><label>Estado</label><select id="st">${statusOpts.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field-row"><label>Quién recibe</label><input id="recv" value="${esc(o.receiver)}"></div><div class="field-row"><label>Kilometraje final</label><input id="km" type="number" step="0.1" min="0" inputmode="decimal" value="${o.km_final??''}"></div><div class="field-row"><label>Observaciones</label><textarea id="obs" rows="3">${esc(o.observations)}</textarea></div><div class="field-row"><label>Evidencia fotográfica (máximo 5 MB)</label><input id="camera" type="file" accept="image/*" capture="environment"><small class="muted">Tomar foto con cámara posterior</small><input id="gallery" type="file" accept="image/*" multiple><small class="muted">Seleccionar varias fotos desde galería (máximo 5 MB cada una)</small></div><button class="primary" onclick="submitDelivery('${id}')">Guardar entrega</button><p id="savemsg" class="muted"></p></div></div>`;}
function closeModal(){$('#modal').innerHTML=''}
async function submitDelivery(id){
 const s=$('#st').value,recv=$('#recv').value.trim(),obs=$('#obs').value,raw=$('#km').value,km=raw===''?null:Number(raw);
 if(s==='Entregado'&&!recv)return alert('Ingrese quién recibe');
 if(km!==null&&(!Number.isFinite(km)||km<0))return alert('Kilometraje inválido');
 const files=[...$('#camera').files,...$('#gallery').files];
 if(files.length>8)return alert('Puedes adjuntar hasta 8 fotos por registro');
 for(const f of files){if(f.size>5*1024*1024)return alert('Cada foto debe pesar máximo 5 MB');if(!['image/jpeg','image/png','image/webp'].includes(f.type))return alert('Formato no admitido: '+f.name)}
 $('#savemsg').textContent='Guardando evidencias...';let paths=[];
 for(const f of files){const path=user.id+'/'+id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:e}=await db.storage.from('delivery-evidence').upload(path,f,{contentType:f.type});if(e){$('#savemsg').textContent='Falló una fotografía';return error(e)}paths.push(path)}
 const {error:e}=await db.rpc('register_delivery',{p_id:id,p_status:s,p_receiver:recv,p_observations:obs,p_km:km,p_evidence:paths[0]||null});
 if(e){$('#savemsg').textContent='Error al registrar entrega';return error(e)}
 let failures=0;
 for(const path of paths){const {error:e2}=await db.rpc('attach_delivery_photo',{p_order_id:id,p_storage_path:path});if(e2){console.warn('No se registró evidencia',e2);failures++}}
 closeModal();await refresh();alert(failures?'Entrega guardada, pero '+failures+' foto(s) no pudieron vincularse. Solicita revisión.':'Entrega registrada correctamente');
}
async function viewEvidence(id){
 const o=orders.find(x=>x.id===id);if(!o||o.category!=='internal')return;
 $('#modal').innerHTML='<div class="modalbg"><div class="modalbox"><div class="flex"><h3 class="grow">Evidencias del pedido</h3><button class="secondary" onclick="closeModal()">Cerrar</button></div><p>Consultando fotografías privadas...</p></div></div>';
 const {data, error:e}=await db.from('delivery_evidence_files').select('storage_path,created_at').eq('order_id',id).order('created_at',{ascending:true});
 if(e){$('#modal').querySelector('.modalbox p').textContent='No se pudieron consultar las evidencias: '+e.message;return}
 const paths=[...new Set([...(o.evidence_path?[o.evidence_path]:[]),...(data||[]).map(x=>x.storage_path)])];
 let html='';for(const path of paths){const {data:signed,error:ee}=await db.storage.from('delivery-evidence').createSignedUrl(path,120);if(ee){html+='<p class="err">Foto no disponible: '+esc(ee.message)+'</p>';continue}
 const u=esc(signed.signedUrl);html+='<div style="margin:12px 0"><a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="Foto de recepción" style="width:100%;max-height:380px;object-fit:contain;border-radius:9px;background:#f1f3f5"></a></div>'}
 $('#modal').innerHTML='<div class="modalbg"><div class="modalbox"><div class="flex"><h3 class="grow">'+esc(o.order_number)+' · Evidencias</h3><button class="secondary" onclick="closeModal()">Cerrar</button></div><p><b>Cliente:</b> '+esc(o.client)+'</p><p><b>Estado:</b> '+esc(o.status)+' · <b>Conductor:</b> '+esc(dname(o.driver))+'</p><p><b>Recibió:</b> '+esc(o.receiver||'No registrado')+' · <b>Km final:</b> '+esc(o.km_final??'—')+'</p><p><b>Fecha/hora:</b> '+esc(o.completed_at?new Date(o.completed_at).toLocaleString('es-EC'):'Sin cierre')+'</p><p><b>Observaciones:</b> '+esc(o.observations||'Sin observaciones')+'</p><h3>Fotografías ('+paths.length+')</h3>'+(html||'<p>Este pedido no tiene fotos vinculadas.</p>')+'</div></div>';
}
function reports(){let months=[...new Set(orders.map(o=>o.dispatch_date.slice(0,7)))].sort().reverse();let m=window.reportMonth||months[0]||day.slice(0,7),d=window.reportDriver||'all';let a=orders.filter(o=>o.category==='internal'&&o.dispatch_date.startsWith(m)&&(d==='all'||o.driver===d));return `<div class="panel2"><h2>Informe mensual gerencial</h2><div class="flex"><label>Mes <input class="control" type="month" value="${m}" onchange="window.reportMonth=this.value;render()"></label><label>Conductor <select class="control" onchange="window.reportDriver=this.value;render()"><option value="all">Todos</option>${['jason','jefferson'].map(x=>`<option value="${x}" ${d===x?'selected':''}>${dname(x)}</option>`).join('')}</select></label><button class="secondary" onclick="exportReport()">Exportar CSV</button></div><p><b>${a.filter(o=>o.status==='Entregado').length}</b> entregadas de <b>${a.length}</b> asignaciones / pedidos</p><div class="tablewrap"><table class="deliverytable"><thead><tr><th>Fecha</th><th>Pedido</th><th>Cliente</th><th>Conductor</th><th>Ruta</th><th>Estado</th><th>Km final</th><th>Receptor</th><th>Evidencias</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.dispatch_date)}</td><td>${esc(o.order_number)}</td><td>${esc(o.client)}</td><td>${dname(o.driver)}</td><td>${o.route_order||''}</td><td>${esc(o.status)}</td><td>${o.km_final??''}</td><td>${esc(o.receiver)}</td><td><button class="secondary" onclick="viewEvidence('${o.id}')">📷 Ver fotos</button></td></tr>`).join('')}</tbody></table></div></div>`}
function exportReport(){const m=window.reportMonth||day.slice(0,7),d=window.reportDriver||'all',a=orders.filter(o=>o.category==='internal'&&o.dispatch_date.startsWith(m)&&(d==='all'||o.driver===d));let rows=[['Despacho','Pedido','Cliente','Destino','Conductor','Ruta','Estado','Km final','Receptor','Observaciones'],...a.map(o=>[o.dispatch_date,o.order_number,o.client,o.destination,dname(o.driver),o.route_order,o.status,o.km_final,o.receiver,o.observations])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a1=document.createElement('a');a1.href=url;a1.download='GLOBAL_ENTREGAS_'+m+'.csv';a1.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function calendar(){let [y,m]=day.split('-').map(Number),first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7,stats={};orders.forEach(o=>{let s=stats[o.dispatch_date]||{a:0,d:0};if(o.category==='internal'){s.a++;if(o.status==='Entregado')s.d++}stats[o.dispatch_date]=s});let cells=[];for(let i=0;i<offset;i++)cells.push('<div style="opacity:.1"></div>');for(let i=1;i<=n;i++){let dt=`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`,s=stats[dt];cells.push(`<div class="${dt===day?'chosen':''}" onclick="day='${dt}';render()"><b>${i}</b><small>${s?s.a+' pedidos · '+s.d+' entreg.':''}</small></div>`)}return `<div class="panel2"><h2>Calendario · ${y}-${String(m).padStart(2,'0')}</h2><div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<div style="min-height:0;text-align:center;background:#f1f2f4"><b>${x}</b></div>`).join('')}${cells.join('')}</div></div>`}
async function openImport(){$('#modal').innerHTML=`<div class="modalbg"><div class="modalbox"><h3>Importar planificación PDF de AS2</h3><p>Se extraen los pedidos; antes de grabar confirma su fecha. Los envíos por transportadora se clasifican como externos y el resto requiere revisión administrativa.</p><input type="file" accept="application/pdf" id="pdffile"><div class="field-row"><label>Fecha de despacho</label><input type="date" id="pdfday" value="${day}"></div><div class="field-row"><label>Modo de carga</label><select id="importmode" class="control"><option value="add">Agregar pedidos nuevos (sin modificar existentes)</option><option value="replace">REEMPLAZAR TODA la planificación de la fecha</option></select></div><p class="muted" style="font-size:12px;color:#a33426">Reemplazar: el archivo nuevo será el único vigente para ese día. Se reinician las asignaciones y estados, incluso los entregados. El historial anterior se archiva para auditoría.</p><button class="secondary" onclick="parsePDF()">Previsualizar</button><div id="pdfpreview"></div><button class="secondary" onclick="closeModal()">Cerrar</button></div></div>`}
let pendingPDF=[];
async function parsePDF(){let f=$('#pdffile').files[0];if(!f)return alert('Seleccione PDF');$('#pdfpreview').textContent='Leyendo PDF...';try{if(!window.pdfjsLib){let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';document.head.appendChild(s);await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject})}let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise, lines=[];for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),tc=await page.getTextContent(),groups=new Map();for(let it of tc.items){let y=Math.round(it.transform[5]/3)*3;groups.set(y,[...(groups.get(y)||[]),{x:it.transform[4],t:it.str}])}for(let vals of [...groups.entries()].sort((a,b)=>b[0]-a[0]).map(z=>z[1]))lines.push(vals.sort((a,b)=>a.x-b.x).map(z=>z.t).join(' '))}let a=[];for(let line of lines){let match=line.match(/(PEC-\d{6})\s+(\d{2}\/\d{2}\/\d{4})\s+(.+)/i);if(!match)continue;let parts=match[3].split(/\s{2,}/),rest=match[3],loc=rest.match(/(?:Pichincha|TUNGURAHUA|COTOPAXI|GUAYAS)\s+(?:QUITO|CAYAMBE|AMBATO|LATACUNGA|GUAYAQUIL)/i);let client=loc?rest.slice(0,loc.index).trim():parts[0]?.trim(),destination=loc?loc[0]:'';let notes=loc?rest.slice(loc.index+loc[0].length).replace(/GLOBAL FLEXOGRAPHY/i,'').trim():'';let external=/COMYTRANS|TRAMACO|SERVIENTREGA|TRANSPORTADORA|COURIER|ENVIA POR|ENV[IÍ]O POR/i.test(notes);a.push({order_number:match[1],order_date:match[2],client,destination,notes,category:external?'external':'internal'})}pendingPDF=a;$('#pdfpreview').innerHTML=`<p><b>${a.length} pedidos detectados</b>. Comprueba los datos antes de grabar.</p><div class="tablewrap"><table class="deliverytable">${a.map((o,i)=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.client)}</td><td><select id="cat-${i}"><option value="internal" ${o.category==='internal'?'selected':''}>Entrega interna</option><option value="external" ${o.category==='external'?'selected':''}>Envío externo</option></select></td></tr>`).join('')}</table></div><button class="primary" onclick="saveImport()">Confirmar importación</button>`}catch(e){$('#pdfpreview').textContent='No se pudo interpretar automáticamente. Comprueba la estructura del PDF.';error(e)}}
async function saveImport(){
 if(profile.role!=='admin')return;
 const date=$('#pdfday').value,mode=$('#importmode')?.value||'add';
 if(!date||!pendingPDF.length)return alert('Selecciona fecha y PDF válido');
 const data=pendingPDF.map((o,i)=>({...o,category:$('#cat-'+i).value,dispatch_date:date}));
 if(new Set(data.map(o=>o.order_number)).size!==data.length)return alert('El archivo contiene pedidos duplicados: revísalo antes de continuar');
 if(mode==='replace'){
  const existing=await db.from('delivery_orders').select('id,status').eq('dispatch_date',date);
  if(existing.error)return error(existing.error);
  const n=(existing.data||[]).length,finalized=(existing.data||[]).filter(x=>['Entregado','Parcial'].includes(x.status)).length;
  const warning=`ATENCIÓN: Se reemplazará COMPLETAMENTE la planificación de ${date}.\n\nPedidos vigentes anteriores: ${n} (incluye ${finalized} entregados/parciales).\nNuevo archivo: ${data.length} pedidos.\n\nLas rutas, asignaciones, estados y registros actuales dejarán de ser vigentes, incluso los ya entregados. La versión anterior se archivará en Supabase.\n\n¿Deseas continuar?`;
  if(!confirm(warning))return;
  const typed=prompt('Para confirmar el reemplazo irreversible de la planificación ACTIVA, escribe REEMPLAZAR:');
  if(typed!=='REEMPLAZAR')return alert('Reemplazo cancelado');
  const {data:count,error:e}=await db.rpc('replace_delivery_plan',{p_date:date,p_orders:data.map(({order_number,order_date,client,destination,notes,category})=>({order_number,order_date,client,destination,notes,category}))});
  if(e)return error(e);
  closeModal();day=date;await refresh();return alert(`Planificación reemplazada correctamente. ${count} pedidos del nuevo PDF están vigentes para ${date}. Las asignaciones y estados deben registrarse nuevamente.`);
 }
 if(!confirm('Agregar '+data.length+' pedidos para '+date+'? Los que ya existen no se sobrescribirán.'))return;
 const all=await db.from('delivery_orders').select('order_number').eq('dispatch_date',date);if(all.error)return error(all.error);
 const existing=new Set((all.data||[]).map(x=>x.order_number));const fresh=data.filter(o=>!existing.has(o.order_number));
 if(!fresh.length)return alert('Todos los pedidos ya existen');const {error:e}=await db.from('delivery_orders').insert(fresh);
 if(e)return error(e);closeModal();day=date;await refresh();alert('Agregados '+fresh.length+' pedidos.');
}
</script></body></html>
